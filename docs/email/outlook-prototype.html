<title>Classic Visions Mail</title>
<style>
/* Layout: OpticAdmin top bar → Outlook ribbon (tabs + command bar, Iris far right) → rail | folders | list | reading pane + CRM timeline */
:root{
  --bg:#0a0a0a;--panel:#1f1f1f;--sunk:#2b2b2b;--hdr:#141414;--line:#333;--fg:#f0f0f0;--muted:#a8a8a8;
  --accent:#4ba0f0;--btn:#0f6cbd;--accent-soft:#1c3550;--sel:#2e3c4c;--warn:#e0a060;--ok:#6cc790;--crit:#ef8a83;--paper:#ffffff;--ink:#242424;
  --sans:"Segoe UI",system-ui,sans-serif;--mono:Consolas,monospace;color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f0f0f0;--panel:#ffffff;--sunk:#f3f3f3;--hdr:#ffffff;--line:#e1e1e1;--fg:#242424;--muted:#616161;
  --accent:#0f6cbd;--accent-soft:#ebf3fc;--sel:#cfe4fa;--warn:#b5651d;--ok:#2e7d4f;--crit:#b3261e;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f0f0f0;--panel:#ffffff;--sunk:#f3f3f3;--hdr:#ffffff;--line:#e1e1e1;--fg:#242424;--muted:#616161;
  --accent:#0f6cbd;--accent-soft:#ebf3fc;--sel:#cfe4fa;--warn:#b5651d;--ok:#2e7d4f;--crit:#b3261e;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13.5px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.app{display:grid;grid-template-rows:auto auto auto 1fr;height:100%}
/* OpticAdmin top bar (from AdminTopBar.tsx) */
.adm{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;background:var(--hdr);border-bottom:1px solid var(--line)}
.adm .ib{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.adm .ib:hover{background:var(--sunk)}
.adm .name{font-weight:600;font-size:14px;letter-spacing:-.01em}
.adm .route{font-size:11px;color:var(--muted)}
.adm .mid{flex:1;max-width:28rem;margin:0 auto;display:flex;gap:8px;align-items:center}
.adm input{flex:1;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--fg);font:inherit;font-size:12.5px}
.adm .av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--fg);display:grid;place-items:center;font-size:10px;font-weight:600}
/* Ribbon */
.tabs{display:flex;align-items:center;gap:4px;padding:4px 12px 2px;font-size:13.5px}
.tabs .t{padding:4px 9px;border-radius:4px;position:relative}
.tabs .t:hover{background:var(--sunk)}
.tabs .t.on{font-weight:600}
.tabs .t.on::after{content:"";position:absolute;left:9px;right:9px;bottom:0;height:2px;background:var(--accent);border-radius:2px}
.tabs .right{margin-left:auto;display:flex;gap:4px}
.tabs .right button{width:30px;height:28px;border-radius:4px;display:grid;place-items:center;color:var(--muted)}
.tabs .right button:hover{background:var(--sunk);color:var(--fg)}
.cmd{display:flex;align-items:center;gap:2px;margin:2px 10px 8px;padding:5px 6px;background:var(--panel);border-radius:8px;overflow-x:auto;min-height:44px}
.cmd>button,.cmd .split>button{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:4px;white-space:nowrap}
.cmd>button:hover,.cmd .split>button:hover{background:var(--sunk)}
.cmd .sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.cmd .split{display:flex;flex:none}
.cmd .new>button{background:var(--btn);color:#fff}
.cmd .new>button:first-child{border-radius:4px 0 0 4px;padding:6px 14px}
.cmd .new>button:last-child{border-radius:0 4px 4px 0;border-left:1px solid rgba(255,255,255,.3)}
.cmd .new>button:hover{background:#115ea3}
.c-del{color:var(--muted)}.c-arch{color:#6ccb5f}.c-rep{color:#e37d80}.c-flag{color:#e37d80}.c-pin{color:#4ba0f0}
.cmd .iris{margin-left:auto;flex:none;width:36px;height:34px;border-radius:8px;background:var(--sunk);display:grid;place-items:center}
.cmd .iris b{width:20px;height:20px;border-radius:6px;background:conic-gradient(from 200deg,#3b82f6,#a855f7,#f43f5e,#f59e0b,#22c55e,#3b82f6);display:block}
/* menus */
.menu{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:5px;text-align:left;font-size:14px}
.menu button:hover{background:var(--sunk)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* panes */
.shell{display:grid;grid-template-columns:48px 230px minmax(280px,360px) 1fr;gap:8px;padding:0 10px 10px 0;min-height:0}
.rail{display:flex;flex-direction:column;align-items:center;gap:4px}
.rail button{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.rail button.on{background:var(--accent-soft);color:var(--accent)}
.folders{overflow:auto;min-width:0}
.grp{padding:12px 12px 4px;font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.tag{font-size:10px;padding:1px 6px;border-radius:3px;background:var(--sunk);color:var(--muted);font-weight:400}
.f{display:flex;justify-content:space-between;align-items:center;width:100%;padding:6px 12px 6px 22px;border-radius:4px;text-align:left;gap:8px}
.f span:first-child{display:flex;gap:8px;align-items:center}
.f:hover{background:var(--sunk)}.f.on{background:var(--sel)}
.f .n{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.ext{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 22px;color:var(--fg);text-decoration:none;border-radius:4px}
.ext:hover{background:var(--sunk)}.ext small{margin-left:auto;color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted);padding:2px 12px 8px 22px;line-height:1.4}
.list{background:var(--panel);border-radius:8px;overflow:auto;min-width:0}
.lh{display:flex;justify-content:center;gap:24px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.lh button{font-weight:600;color:var(--muted);font-size:14px;padding-bottom:2px}
.lh button.on{color:var(--fg);border-bottom:2px solid var(--accent)}
.m{display:block;width:100%;text-align:left;border-bottom:1px solid var(--line);padding:9px 14px 9px 12px;border-left:3px solid transparent}
.m:hover{background:var(--sunk)}.m.on{background:var(--sel)}
.m.unread{border-left-color:var(--accent)}.m.unread .s{font-weight:600}
.m .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.m .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .t{color:var(--muted);font-size:11.5px;white-space:nowrap;display:flex;gap:4px;align-items:center}
.m .sub{font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .pv{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:9px;margin-right:4px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.read{display:grid;grid-template-columns:1fr 290px;background:var(--panel);border-radius:8px;overflow:hidden;min-width:0;min-height:0}
.body{overflow:auto;padding:20px 28px;min-width:0}
.body h1{font-size:20px;font-weight:600;margin:0 0 12px;text-wrap:balance}
.from{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.avt{width:36px;height:36px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.meta{font-size:12px;color:var(--muted)}
.logged{display:inline-flex;gap:5px;align-items:center;font-size:11.5px;color:var(--ok);margin-left:8px}
.txt{max-width:65ch;line-height:1.6;white-space:pre-wrap}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.att{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:12px;background:var(--sunk);text-align:left}
.att:hover{border-color:var(--accent)}
.acts{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap}
.acts button{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:5px 12px}
.acts button:hover{background:var(--sunk)}
.crm{border-left:1px solid var(--line);background:var(--sunk);overflow:auto;padding:16px}
.crm h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}
.crm h3:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}.kv span:nth-child(odd){color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
.item{border:1px solid var(--line);border-radius:4px;padding:7px 9px;margin-bottom:6px;font-size:12.5px;background:var(--panel)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px;display:grid;gap:8px}
.tl div{font-size:12px;position:relative}
.tl div::before{content:"";position:absolute;left:-17px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.tl .in::before{background:var(--accent)}.tl .out::before{background:var(--ok)}
.cbtn{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:1px dashed var(--accent);color:var(--accent);border-radius:4px;padding:6px 9px;margin-bottom:6px}
.empty{color:var(--muted);padding:60px 20px;text-align:center}
.view{overflow:auto;padding:20px 24px;grid-column:2/5;background:var(--panel);border-radius:8px}
.cal{display:grid;grid-template-columns:60px repeat(5,1fr);border:1px solid var(--line);min-width:640px}
.cal div{border-bottom:1px solid var(--line);border-left:1px solid var(--line);min-height:44px;padding:4px;font-size:12px}
.cal .h{font-weight:600;background:var(--sunk);min-height:auto}
.ev{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:3px 5px;font-size:11.5px}
.ev.task{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
/* dialogs */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;z-index:40}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(640px,100%);max-height:90vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dlg header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg header b{font-size:15px}
.dlg .c{padding:16px 18px;display:grid;gap:12px}
.dlg label{font-size:12px;color:var(--muted);display:grid;gap:4px}
.dlg input,.dlg textarea,.dlg select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
.dlg footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);border-radius:4px;padding:6px 14px}
.btn.p{background:var(--btn);border-color:var(--btn);color:#fff}
.rule{border:1px solid var(--line);border-radius:4px;padding:10px;font-size:12.5px;display:grid;gap:3px}
.rule code{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.json{font-family:var(--mono);font-size:11.5px;background:var(--sunk);padding:10px;border-radius:4px;white-space:pre;overflow-x:auto}
.drop{border:2px dashed var(--line);border-radius:6px;padding:26px;text-align:center;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.pdf{background:#fff;color:#222;border-radius:4px;padding:24px;font-size:12px;line-height:1.6;min-height:260px}
/* compose window */
.cw{position:fixed;inset:24px;z-index:35;background:var(--bg);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-rows:auto auto auto 1fr;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.cw .ttl{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--hdr);font-size:13px}
.cgrp{display:flex;gap:2px;margin:2px 10px 8px;padding:6px;background:var(--panel);border-radius:8px;overflow-x:auto}
.cg{display:flex;flex-direction:column;align-items:center;padding:0 10px;border-right:1px solid var(--line);flex:none}
.cg .r{display:flex;gap:4px;align-items:center;flex:1}
.cg small{font-size:10.5px;color:var(--muted);margin-top:4px}
.cg button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:4px;font-size:12px;white-space:nowrap}
.cg button.sm{flex-direction:row;font-size:12.5px}
.cg button:hover{background:var(--sunk)}
.cg select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font:inherit;font-size:12.5px}
.sheet{background:var(--paper);color:var(--ink);overflow:auto;display:grid;align-content:start}
.sheet .row{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid #ddd}
.sheet input{flex:1;border:0;font:inherit;font-size:14px;color:var(--ink);background:transparent;outline:0}
.send{display:flex}.send button{background:var(--btn);color:#fff;padding:7px 16px;display:flex;gap:6px;align-items:center}
.send button:first-child{border-radius:4px 0 0 4px}.send button:last-child{border-radius:0 4px 4px 0;border-left:1px solid rgba(255,255,255,.3);padding:7px 8px}
.tobtn{border:1px solid #ccc;border-radius:4px;padding:5px 14px;color:var(--ink)}
.sheet textarea{border:0;font:inherit;font-family:Calibri,"Segoe UI",sans-serif;font-size:15px;color:var(--ink);background:transparent;padding:16px 18px;min-height:220px;resize:none;outline:0}
.hmw{display:flex;gap:8px;align-items:center;padding:12px 18px 0;color:#555;font-size:14px}.hmw button{color:#0f6cbd}
.catts{display:flex;gap:8px;padding:8px 18px;flex-wrap:wrap}.catts span{border:1px solid #ccc;border-radius:4px;padding:4px 8px;font-size:12px;color:var(--ink)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:4px;z-index:60}
.note{font-size:11.5px;color:var(--muted)}
.annot{position:fixed;inset:0;z-index:50;cursor:crosshair}
.annot .bar2{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;gap:8px;align-items:center;cursor:default}
@media (max-width:1100px){.read{grid-template-columns:1fr}.crm{border-left:0;border-top:1px solid var(--line)}}
@media (max-width:760px){.shell{grid-template-columns:48px 1fr}.folders,.read{display:none}.shell.reading .list{display:none}.shell.reading .read{display:grid;grid-column:2}.view{grid-column:2}.adm .route,.tabs .right{display:none}.cw{inset:0}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="app">
  <header class="adm">
    <button class="ib" title="Applications" data-a="apps" id="appsBtn"></button>
    <span class="name">OpticAdmin</span><span class="route">Email</span>
    <div class="mid"><button class="ib" title="Go back" data-i="arrow"></button><input id="q" placeholder="Search mail, contacts, orders…  (Ctrl K)"></div>
    <button class="ib" title="Notifications" data-i="bell"></button>
    <button class="ib" title="Edit content" data-i="pencil"></button>
    <button class="ib" title="Help" data-i="help"></button>
    <button class="ib" title="Settings" data-i="gear"></button>
    <button class="ib" title="Toggle theme" data-a="theme" data-i="moon"></button>
    <span class="av">RC</span>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="cmd" id="cmd"></div>
  <div class="shell" id="shell">
    <nav class="rail" id="rail"></nav>
    <div class="folders" id="folders"></div>
    <div class="list" id="list"></div>
    <div class="read" id="read"></div>
  </div>
</div>
<div id="layer"></div>

function parseRule(t){
 const s=t.toLowerCase(),r={conditions:[],actions:[]};
 const from=t.match(/from\s+([\w.@-]+(?:\s+(?:or|and|,)\s+[\w.@-]+)*)/i);
 if(from)r.conditions.push({field:'from',contains:from[1].split(/\s*(?:or|and|,)\s*/)});
 const subj=t.match(/(?:subject|mention(?:s|ing)?)\s+(?:contains\s+)?["“]?([^"”,]+?)["”]?(?:\s+(?:to|into|then|and)\b|,|$)/i);
 if(subj)r.conditions.push({field:'subject_or_body',contains:[subj[1].trim()]});
 if(/attachment/.test(s))r.conditions.push({field:'has_attachment',equals:true});
 const mv=t.match(/(?:move|file|put)\s+(?:them|it)?\s*(?:to|into|in)\s+(?:the\s+)?["“]?([\w ]+?)["”]?(?:\s+folder)?(?:\s+and\b|,|\.|$)/i);
 if(mv)r.actions.push({type:'move_to_folder',folder:mv[1].trim()});
 const fw=t.match(/forward\s+(?:them|it)?\s*to\s+([\w.@-]+)/i);
 if(fw)r.actions.push({type:'forward',to:fw[1]});
 if(/task/.test(s))r.actions.push({type:'create_crm_task',due:/tomorrow/.test(s)?'+1d':'+2d'});
 if(/flag|important|urgent/.test(s))r.actions.push({type:'flag',importance:'high'});
 if(!r.conditions.length)r.conditions.push({field:'any',note:'needs clarification'});
 if(!r.actions.length)r.actions.push({type:'tag',value:'AI-sorted'});
 return r;
}

 const m=mails.find(x=>x.id==st.sel),a=m.att[i];
 dlg(a[0],a[0].endsWith('.jpg')?`<div class="pdf" style="display:grid;place-items:center;background:#ddd">[ photo preview: ${esc(a[0])} ]</div>`:`<div class="pdf"><b>${esc(a[0].replace('.pdf','').toUpperCase())}</b><br><br>Patient re-measure, left eye<br>Fitting height 18 · Corridor 14mm (requested)<br>PD 31.5 / 32.0<br><br>Signed: Iris Clarke, Bay Street Optical</div>`,
 `<button class="btn" data-a="saveatt">Save to customer file</button><button class="btn p" data-close>Close</button>`);
}
function compose(pre){
 const m=mails.find(x=>x.id==st.sel)||{};
 const to=pre=='reply'?m.email:'',sub=pre=='reply'?'RE: '+m.sub:pre=='fwd'?'FW: '+m.sub:'';
 const body=pre=='ai'?`Hi ${m.from?.split(' ')[0]},\n\nThanks for flagging this. We'll remake RX-88214 with the corridor shortened to 14mm, same frame and AR. Expected turnaround is 3 working days; I'll confirm once it's in the lab.\n\nBest,\nClassic Visions Orders`:'';
 const from=accounts.find(a=>a.id==(m.a||'o')).name;
 const g=(label,inner)=>`<div class="cg"><div class="r">${inner}</div><small>${label}</small></div>`;
 $('#layer').innerHTML=`<div class="cw" role="dialog" aria-label="New mail"><div class="ttl"><span>${pre=='ai'?'Reply drafted by Iris':'New mail'}</span><button data-close aria-label="Close">✕</button></div>
  <div class="tabs"><button class="t">File</button><button class="t on">Message</button><button class="t">Insert</button><button class="t">Format text</button><button class="t">Options</button></div>
  <div class="cgrp">
   ${g('Basic Text',`<select aria-label="Font"><option>Calibri</option><option>Segoe UI</option></select><select aria-label="Size"><option>12</option><option>11</option><option>14</option></select><button class="sm"><b>B</b></button><button class="sm"><i>I</i></button><button class="sm"><u>U</u></button><button class="sm" style="color:#e37d80">A</button>`)}
   ${g('Paragraph',`<button class="sm">• List</button><button class="sm">1. List</button><button class="sm">≡</button>`)}
   ${g('Insert',`<button class="sm" data-a="attach">${ic('clip')} Attach file</button><button class="sm">${ic('img')} Pictures</button><button class="sm">${ic('link')} Link</button><button class="sm">Signature</button>`)}
   ${g('Voice',`<button>${ic('mic')} Dictate</button>`)}
   ${g('Tags',`<button class="sm" style="color:#e37d80">! High importance</button><button class="sm">${ic('lock')} Encrypt</button>`)}
   ${g('CRM',`<button class="sm" data-a="toggleLog" id="logBtn">${ic('check')} Log to CRM: on</button><button class="sm" data-a="tmpl">${ic('tmpl')} Template</button>`)}
  </div>
  <div class="sheet">
   <div class="row"><div class="send"><button data-done="Sent from ${esc(from)} and logged to CRM">${ic('send')} Send</button><button aria-label="Send options">${ic('chev')}</button></div><span style="font-size:13.5px">From: <b>${esc(from)}</b></span></div>
   <div class="row"><button class="tobtn">To</button><input id="to" value="${esc(to)}" placeholder=""></div>
   <div class="row"><input id="sb" value="${esc(sub)}" placeholder="Add a subject"></div>
   <div class="catts" id="catts"></div>
   ${body?'':`<div class="hmw">${ic('spark')} Start typing or <button data-a="hmw">Help me write with Iris</button></div>`}
   <textarea id="bd" aria-label="Message body">${esc(body)}</textarea>
  </div></div>`;
}
function newMenu(anchor){menu(anchor,[['mail','Mail','compose'],['tmpl','Mail from template','tmpl'],['cal','Event','event'],['users','Group','group']])}
function fileMenu(anchor){menu(anchor,[['user','Account info','account'],'-',['save','Save as','saveas'],['print','Print','printmsg'],['open','Open and export','import'],'-',['gear','Settings','viewsettings']])}
function irisDlg(){
 dlg('Iris',`<div class="note">Ask Iris about your mail, or tell her what to do.</div>
  <div class="item">“Summarise what Bay Street Optical has sent this week.”</div>
  <div class="item">“Draft replies to everything in Rx Orders that's waiting on a turnaround date.”</div>
  <div class="item">“Move newsletters to Archive every Friday.”</div>
  <label>Message<input id="ask" placeholder="Ask Iris…"></label>`,`<button class="btn" data-close>Close</button><button class="btn p" data-done="Iris is working on it (simulated)">Ask</button>`);
}
function annotate(){
 $('#layer').innerHTML=`<div class="annot" id="an"><div class="bar2">${ic('annot')} Click anywhere to pin a note · <button class="btn p" data-done="Annotations sent with your feedback">Send</button><button class="btn" data-close>Cancel</button></div></div>`;
 $('#an').addEventListener('click',e=>{if(e.target.id!='an')return;const d=document.createElement('div');d.style.cssText=`position:fixed;left:${e.clientX}px;top:${e.clientY}px;background:#f59e0b;color:#000;padding:4px 8px;border-radius:4px 4px 4px 0;font-size:12px`;d.textContent='Note '+($('#an').children.length);$('#an').append(d)});
}

document.addEventListener('click',e=>{
 const t=e.target.closest('button');
 if(!t){if(!e.target.closest('.menu'))document.querySelector('.menu')?.remove();return}
 if(t.hasAttribute('data-close'))return close();
 if(t.dataset.done){close();return toast(t.dataset.done)}
 if(t.dataset.app){st.app=t.dataset.app;close();return render()}
 if(t.dataset.rib){st.rib=t.dataset.rib;return renderRibbon()}
 if(t.dataset.af){[st.a,st.f]=t.dataset.af.split('|');st.sel=(mails.find(m=>m.a==st.a&&m.f==st.f)||{}).id;st.app='mail';return render()}
 if(t.dataset.tab){st.tab=t.dataset.tab;return renderList()}
 if(t.dataset.att){return attView(+t.dataset.att)}
 if(t.dataset.id){st.sel=+t.dataset.id;mails.find(x=>x.id==st.sel).unread=0;$('#shell').classList.add('reading');return render()}
 const a=t.dataset.a;if(!a)return;
 const m=mails.find(x=>x.id==st.sel);
 if(document.querySelector('.menu'))close();
 ({compose:()=>compose(),reply:()=>compose('reply'),fwd:()=>compose('fwd'),aidraft:()=>compose('ai'),
  newmenu:()=>newMenu(t),file:()=>fileMenu(t),rules:rulesDlg,ai:aiDlg,account:acctDlg,import:importDlg,iris:irisDlg,annotate,
  feedback:()=>dlg('Send feedback','<label>What would make Email better?<textarea id="fb" rows="4"></textarea></label><label><span><input type="checkbox" checked> Include a screenshot</span></label>','<button class="btn" data-close>Cancel</button><button class="btn p" data-done="Feedback sent to the Feature Board">Send</button>'),
  tmpl:()=>dlg('Mail from template',['Rx order received','Remake confirmation','Statement attached','New-practice welcome pack'].map(x=>`<div class="item">${ic('tmpl')} ${x}</div>`).join('')),
  event:()=>{st.app='cal';render();toast('New event opens in the calendar')},group:()=>toast('Groups map to CRM contact lists'),
  del:()=>{if(m){m.f='Deleted Items';render();toast('Moved to Deleted Items')}},archive:()=>{if(m){m.f='Archive';render();toast('Archived')}},
  report:()=>toast('Reported as junk'),flag:()=>{if(m){m.flag=!m.flag;renderList()}},pin:()=>toast('Pinned to top'),snooze:()=>toast('Snoozed until tomorrow 8:00'),
  zoom:()=>{document.body.style.fontSize=document.body.style.fontSize?'':'15.5px'},darkread:()=>toast('Reading pane theme toggled'),sync:()=>toast('Synced 2 mailboxes'),
  densitym:()=>{st.density=st.density=='compact'?'normal':'compact';renderList();toast('Density: '+st.density)},
  folderpane:()=>{const f=$('#folders');f.hidden=!f.hidden;$('#shell').style.gridTemplateColumns=f.hidden?'48px 0 minmax(280px,360px) 1fr':''},
  viewsettings:()=>dlg('Settings','<div class="item">Layout · Rules · Forwarding · Signatures · Accounts</div><div class="note">Forwarding: orders@ → backup@classicvisions.bb, keep a copy.</div>'),
  theme:()=>{const r=document.documentElement,d=matchMedia('(prefers-color-scheme: dark)').matches;const cur=r.dataset.theme||(d?'dark':'light');r.dataset.theme=cur=='dark'?'light':'dark'},
  task:()=>{crm[m.from].tasks.push('Re: '+m.sub);renderRead();toast('Task created and added to the calendar')},
  meet:()=>{window.extraEv={'Wed 7|15:00':['ev','Meeting: '+m.from]};toast('Added Wed 3:00 pm. Open Calendar to see it')},
  ticket:()=>toast('Support ticket opened from this email'),saveatt:()=>{close();toast('Saved to the customer’s documents')},
  addcontact:()=>{crm[m.from]={co:'New Optical Shop',acct:'—',bal:'—',status:'Lead',orders:[],tasks:[],tl:[['in',m.t,'Received: '+m.sub]]};renderRead();toast('Contact added; email logged')},
  attach:()=>{$('#catts').innerHTML+=`<span>${ic('clip')} RX-88214-remake.pdf</span>`},
  toggleLog:()=>{t.innerHTML=t.innerHTML.includes(': on')?ic('check')+' Log to CRM: off':ic('check')+' Log to CRM: on'},
  hmw:()=>{$('#bd').value='Hi,\n\nThanks for getting in touch. ';t.parentElement.remove()},
  saveas:()=>toast('Saved as .eml'),printmsg:()=>toast('Print preview (not available in prototype)'),
  apps:()=>toast('App launcher: Email sits beside CRM, Orders, Helpdesk…'),soon:()=>toast('Not in the prototype'),
  msgs:()=>toast('Show as conversations / messages'),layoutm:()=>toast('Reading pane: right / bottom / off'),more:()=>toast('More actions'),
 }[a]||(()=>{}))();
});
$('#q').oninput=renderList;
render();
</script>

[functions.innovations-sync]
verify_jwt = false
# Innovations -> CV outbound sync receiver. Auth is x-api-key in code
# (verify_api_key + per-resource write scope), so the platform JWT gate is off.
# MUST stay false: the office optilens-local caller sends no Authorization header.
[functions.statement-document-worker]
verify_jwt = false
# Internal worker authentication is performed with STATEMENT_DOCUMENT_WORKER_SECRET.
[functions.statement-document]
verify_jwt = false
# Customer session authorization is performed inside the function so the portal
# can call it with its Supabase bearer token.
  # On-demand CV Web -> office gateway. Browser requests authenticate in code;
  # the OptiLens agent uses a scoped x-api-key, so the platform JWT gate is off.
  # MUST stay verify_jwt = false (gateway-level 401s break the on-prem agent).
  [functions.live-data-gateway]
    verify_jwt = false
  # Vercel QBO gateway broker. Auth is performed in code with the scoped
  # Lovable API key; the managed service-role key never leaves this function.
  [functions.qbo-gateway]
    verify_jwt = false
  # Admin-only redeploy trigger. Does its own admin check in code
  # (requirePrivilegedAccess); platform-level verify_jwt stays on too since
  # there's no special caller like the on-prem agent to accommodate.
  [functions.redeploy-edge-function]
    verify_jwt = true
  # The MCP runtime performs its own OAuth 2.1 bearer validation and must be
  # allowed to return the protocol's WWW-Authenticate discovery challenge.
  [functions.mcp]
    verify_jwt = false
  # Scotia eCom+ (IPG Connect) hosted-payment helper. An authenticated buyer
  # can only obtain a signed gateway form for their own pending payment intent.
  [functions.scotia-payment]
    verify_jwt = true
  # Scotia eCom+ redirect-back endpoint. MUST stay verify_jwt=false — Fiserv's
  # hosted page POSTs the buyer's browser back here directly (no Supabase
  # session, no Authorization header at all). Authenticity comes entirely from
  # the response hash, verified in code before anything is settled.
  [functions.scotia-return]
    verify_jwt = false
  # Scotia eCom+ server-to-server notification webhook. MUST stay
  # verify_jwt=false — Fiserv posts here directly with no Supabase session.
  # Authenticity is proved by recomputing the response hash before settling.
  [functions.scotia-notify]
    verify_jwt = false
  # DHL credentials are tested only by an authenticated admin; all carrier
  # operations remain server-side so Basic Auth can never reach the browser.
  [functions.dhl-express]
    verify_jwt = true
  # Read-only Copilot facts/prompt display for Settings -> Integrations -> AI
  # Agents. Admin-only via requirePrivilegedAccess; no writes, no side effects.
  [functions.copilot-facts]
    verify_jwt = true
  # Gatekeeper connects and sends explicitly released Rx orders. It does its
  # own admin-role check and keeps the one-time PIN/JWT/bearer token server-side.
  [functions.gatekeeper-orders]
    verify_jwt = true

  # Scheduled agent-surface health probe (MCP, Portal Copilot, helpdesk SLA
  # schema). Runs from pg_cron with the service role; it also validates its
  # own caller-independent probes, so no user JWT is required.
  [functions.platform-health-check]
    verify_jwt = false

  # Nightly CRM contact enrichment sweep and the new-contact worker. pg_cron
  # calls it with a shared X-Scheduler-Secret and has no Supabase session, so
  # gateway JWT verification must stay off. Administrator-initiated runs are
  # authenticated in-function with requirePrivilegedAccess, and a scheduled
  # call may not name a specific contact.
  [functions.crm-enrich-contacts]
    verify_jwt = false


  # Staging mirror of the app MCP server. The managed "mcp" function only
  # deploys on publish, so this copy makes the OAuth metadata observable now.
  [functions.mcp-staging]
    verify_jwt = false

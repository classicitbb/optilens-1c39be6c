  [functions.api-v1]
    verify_jwt = false
  # Innovations -> CV outbound sync receiver. Auth is x-api-key in code
  # (verify_api_key + per-resource write scope), so the platform JWT gate is off.
  [functions.innovations-sync]
    verify_jwt = false
  # On-demand CV Web -> office gateway. Browser requests authenticate in code;
  # the OptiLens agent uses a scoped x-api-key, so the platform JWT gate is off.
  [functions.live-data-gateway]
    verify_jwt = false
  # The MCP runtime performs its own OAuth 2.1 bearer validation and must be
  # allowed to return the protocol's WWW-Authenticate discovery challenge.
  [functions.mcp]
    verify_jwt = false
  # Scotia eCom+ (IPG Connect) hosted-payment helper. An authenticated buyer
  # can only obtain a signed gateway form for their own pending payment intent.
  [functions.scotia-payment]
    verify_jwt = true
  # Scotia eCom+ redirect-back endpoint. MUST stay verify_jwt=false — Fiserv's
  # hosted page POSTs the buyer's browser back here directly (no Supabase
  # session, no Authorization header at all). Authenticity comes entirely from
  # the response hash, verified in code before anything is settled.
  [functions.scotia-return]
    verify_jwt = false
  # Scotia eCom+ server-to-server notification webhook. MUST stay
  # verify_jwt=false — Fiserv posts here directly with no Supabase session.
  # Authenticity is proved by recomputing the response hash before settling.
  [functions.scotia-notify]
    verify_jwt = false
